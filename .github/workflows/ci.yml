name: CI

on:
  push:
    branches:
      - main
      - refactor/vnext-ts-isolation
      - merge/vnext-tauri
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!research/**'
      - '**/SKILL.md'
      - '.agents/skills/deepseek-harness-eac-dev/**'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!research/**'
      - '**/SKILL.md'
      - '.agents/skills/deepseek-harness-eac-dev/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tauri ${{ matrix.os }} x64
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-shell -> target
            dsh-desktop/native/supervisor -> target
            dsh-desktop/native/snapshot -> target
          key: ${{ matrix.os }}-x64

      - name: 安装依赖
        run: npm ci

      - name: 获取内置运行时
        run: npm run fetch-runtime

      - name: 类型检查
        run: npm run typecheck

      - name: Rust clippy
        run: npm run clippy:native

      - name: Rust 原生模块测试
        run: npm run test:native

      - name: 预构建 TypeScript（生成 sidecar/bridge.js 供壳层 include_str! 引用）
        run: npm run build

      - name: Tauri 壳 clippy（-D warnings，含测试代码）
        shell: bash
        run: |
          mkdir -p ../tauri-shell/staged-resources/sidecar ../tauri-shell/staged-resources/dsh-desktop
          cargo clippy --manifest-path ../tauri-shell/Cargo.toml --all-targets -- -D warnings

      - name: Tauri 壳测试（先建 staged-resources 占位，满足 tauri-build 资源校验）
        shell: bash
        run: |
          mkdir -p ../tauri-shell/staged-resources/sidecar ../tauri-shell/staged-resources/dsh-desktop
          cargo test --manifest-path ../tauri-shell/Cargo.toml --no-fail-fast

      - name: 构建 Rust 原生模块（Node 测试前生成平台原生 index.node）
        run: npm run build:native

      - name: Node 测试（超时自动重试，最多 3 次）
        uses: nick-fields/retry@v3
        with:
          shell: bash
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error,timeout
          # retry action 不继承 defaults.run.working-directory，需显式 cd
          command: cd dsh-desktop && npm test

      - name: 构建 Tauri
        run: npm run tauri:build

      - name: 安装包体积断言（NSIS <256MB，Task 12③）
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          exe=$(ls tauri-shell/target/release/bundle/nsis/*.exe | head -1)
          size=$(stat -c%s "$exe")
          echo "NSIS size = $size bytes ($exe)"
          # 上限 256MB（268435456）：Tauri 版内置 38 插件 + 10 皮肤 + dafeiyu
          # helper(51MB) 等资产，Electron 时代的 80MB 约束已不适用；若需回落
          # 小包，可把大资产改按需下载（见 stage-resources 的平台裁剪）。
          node -e "const s=Number('$size'); if (s >= 268435456) { console.error('NSIS >= 256MB: '+s); process.exit(1); } console.log('OK: < 256MB');"

      - name: 上传 Windows 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eac-windows-x64-ci
          path: |
            tauri-shell/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Linux 产物
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eac-linux-x64-ci
          path: |
            tauri-shell/target/release/bundle/deb/*.deb
            tauri-shell/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  linux-smoke:
    name: Linux 产物冒烟（干净容器）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码（取冒烟脚本）
        uses: actions/checkout@v4

      - name: 下载 Linux 产物
        uses: actions/download-artifact@v4
        with:
          name: dsh-eac-linux-x64-ci
          path: artifacts

      - name: 容器内三级冒烟（AppImage 提取 / deb 安装卸载 / sidecar 探活）
        run: |
          docker run --rm \
            -v "$PWD/artifacts:/a:ro" \
            -v "$PWD/tauri-shell/scripts:/scripts:ro" \
            ubuntu:24.04 \
            bash -c '
              set -euo pipefail
              apt-get update -qq >/dev/null
              # Tauri v2 Linux 运行依赖（deb 安装依赖检查 / AppImage 冒烟用）：
              # libfuse2（AppImage 提取）、libgtk-3-0 + libwebkit2gtk-4.1-0
              # + libayatana-appindicator3-1 + librsvg2-2（deb 的 Depends 链）。
              apt-get install -y -qq libfuse2 ca-certificates libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 >/dev/null
              bash /scripts/linux-smoke.sh /a /scripts
            '

  windows-smoke:
    name: Windows 产物冒烟（NSIS 安装 + 对话界面启动）
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码（取冒烟脚本）
        uses: actions/checkout@v4

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: dsh-eac-windows-x64-ci
          path: artifacts

      - name: 冒烟（NSIS 静默安装 → 安装树探活 → 对话界面）
        shell: bash
        run: |
          bash tauri-shell/scripts/windows-smoke.sh "$PWD/artifacts" "$PWD/tauri-shell/scripts"

