name: Release Tauri

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 6.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-tauri-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tauri ${{ matrix.os }} x64
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 从标签或输入提取版本号
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          if [[ "$raw" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::'$raw' 不是有效版本号"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then tag="v${version}"; else tag="${GITHUB_REF_NAME}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-shell -> target
            dsh-desktop/native/supervisor -> target
            dsh-desktop/native/snapshot -> target
          key: release-${{ matrix.os }}-x64

      - name: 安装依赖
        run: npm ci

      - name: 注入 package 版本
        run: npm version ${{ steps.tag.outputs.version }} --no-git-tag-version --allow-same-version

      - name: 注入 Tauri 版本
        working-directory: tauri-shell
        shell: bash
        run: node -e "const fs=require('fs');const f='tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version='${{ steps.tag.outputs.version }}';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - name: 获取内置运行时
        run: npm run fetch-runtime

      - name: 类型检查
        run: npm run typecheck

      - name: Rust 原生模块测试
        run: npm run test:native

      - name: Tauri 壳测试（先建 staged-resources 占位，满足 tauri-build 资源校验）
        shell: bash
        run: |
          mkdir -p ../tauri-shell/staged-resources/sidecar ../tauri-shell/staged-resources/dsh-desktop
          cargo test --manifest-path ../tauri-shell/Cargo.toml

      - name: Node 测试
        run: npm test

      - name: 构建 Rust 原生模块
        run: npm run build:native

      - name: 构建 Tauri
        run: npm run tauri:build

      - name: 构建 Windows 便携包
        if: runner.os == 'Windows'
        working-directory: tauri-shell
        run: node make-portable.mjs --out target/release/portable

      - name: 规范化 Windows NSIS 命名（对齐历史规范）
        if: runner.os == 'Windows'
        working-directory: tauri-shell
        shell: bash
        run: |
          ver="${{ steps.tag.outputs.version }}"
          cd target/release/bundle/nsis
          for f in *-setup.exe; do mv "$f" "Deepseek-Harness-EAC-Setup-${ver}-x64.exe"; break; done
          ls -la

      - name: 规范化 Linux 产物命名（对齐历史规范 OQ-2）
        if: runner.os == 'Linux'
        working-directory: tauri-shell
        shell: bash
        run: |
          ver="${{ steps.tag.outputs.version }}"
          cd target/release/bundle
          for f in appimage/*.AppImage; do mv "$f" "appimage/Deepseek-Harness-EAC-${ver}-x86_64.AppImage"; break; done
          for f in deb/*.deb; do mv "$f" "deb/Deepseek-Harness-EAC-${ver}-amd64.deb"; break; done
          ls -la appimage deb

      - name: 汇总产物并生成 SHA256 与新鲜度校验
        working-directory: dsh-desktop
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp ../tauri-shell/target/release/bundle/nsis/*.exe dist/
            cp ../tauri-shell/target/release/bundle/nsis/*.blockmap dist/ 2>/dev/null || true
            cp ../tauri-shell/target/release/portable/*.zip dist/
            node scripts/make-release-hashes.js dist
            node scripts/verify-dist-fresh.js .. --bundle=../tauri-shell/target/release/bundle --portable=../tauri-shell/target/release/portable --platform=win
          else
            cp ../tauri-shell/target/release/bundle/deb/*.deb dist/
            cp ../tauri-shell/target/release/bundle/appimage/*.AppImage dist/
            node scripts/make-release-hashes.js dist
            node scripts/verify-dist-fresh.js .. --bundle=../tauri-shell/target/release/bundle --platform=linux
          fi
          echo '--- dist ---'
          ls -la dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eac-${{ runner.os }}-x64-release
          path: dsh-desktop/dist/*
          if-no-files-found: error

  release:
    name: 发布双平台资产
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag || github.ref_name }}
          name: ${{ needs.build.outputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
