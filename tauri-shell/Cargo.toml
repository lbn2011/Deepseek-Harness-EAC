[package]
name = "dsh-eac-tauri-shell"
version = "0.1.0"
description = "Deepseek Harness EAC — Tauri ShellHost PoC (ADR 0002 L1)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "process", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
http = "1"
url = "2"

# main.rs 的 devtools 菜单动作以该 feature 显式门禁（release 默认关闭）。
[features]
devtools = []

# 本 crate 级严格 lint：未知 cfg 条件（如未声明 feature）直接编译失败，
# 避免 unexpected_cfgs 这类警告被忽视（CI cargo test 与 clippy 双门禁）。
[lints.rust]
unexpected_cfgs = "deny"

[[bin]]
name = "dsh-eac-shell"
path = "src/main.rs"

[profile.dev]
incremental = true
